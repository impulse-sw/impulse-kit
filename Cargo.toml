cargo-features = ["panic-immediate-abort", "trim-paths"]

[workspace]
members = [
  "impulse-utils",
  "impulse-server-kit",
  "impulse-server-kit-dsl",
  "impulse-static-server",
  "impulse-client-kit",
  "impulse-client-kit/components",
  "impulse-client-kit/blocks",
  "impulse-client-kit/tailwind-sources",
  "impulse-client-kit/examples/showcase",
  "impulse-client-kit/examples/ssr_showcase",
  "impulse-client-ring",
  "impulse-error-pages",
]
resolver = "3"

[workspace.package]
version = "1.4.0-rc.6"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Klimenty Titov <titoffklim@verbalautomation.tech>"]

[workspace.dependencies]
impulse-server-kit = { path = "impulse-server-kit", default-features = false }
impulse-skdsl = { path = "impulse-server-kit-dsl" }
impulse-static-server = { path = "impulse-static-server" }
impulse-utils = { path = "impulse-utils", default-features = false }
impulse-client-kit = { path = "impulse-client-kit", default-features = false }
impulse-client-kit-components = { path = "impulse-client-kit/components", default-features = false }
impulse-client-kit-blocks = { path = "impulse-client-kit/blocks", default-features = false }
impulse-tailwind-sources = { path = "impulse-client-kit/tailwind-sources" }
impulse-client-ring = { path = "impulse-client-ring", default-features = false }

impulse-ring-connector = { git = "https://github.com/impulse-sw/impulse-ring.git", tag = "0.6.0" }
impulse-ring-http = { git = "https://github.com/impulse-sw/impulse-ring.git", tag = "0.6.0" }

anyhow = "1"
apache-avro = "0.17"
brotli = { version = "7", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false }
futures-core = "0.3"
futures-util = "0.3"
fs-change-notifier = "0.1.3"
headers = "0.4"
http = "1"
http-body-util = "0.1"
icondata = { version = "0.5", default-features = false }
leptos = { version = "0.8.12", default-features = false }
leptos_meta = "0.8"
leptos-use = { version = "0.16", default-features = false }
log = "0.4"
mime = "0.3"
notify = "8.0"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry_sdk = { version = "0.32", default-features = false }
reqwest = { version = "0.13", default-features = false }
rmp-serde = "=1.3.1"
rustls = "0.23"
salvo = { version = "^0.93.0", default-features = false }
serde = { version = "1", default-features = false }
serde_json = "1"
serde_pretty_yaml = "0.9.37"
smart-patcher = { version = "0.3.0-1", default-features = false }
sonic-rs = "0.5.1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-ecs = "0.5"
tracing-opentelemetry = "0.33"
tracing-rfc-5424 = "0.1.4"
tracing-subscriber = "0.3"
zstd = { version = "0.13", default-features = false }
js-sys = { version = "0.3", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
web-sys = { version = "0.3.82", default-features = false }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = true
incremental = false
trim-paths = "all"
