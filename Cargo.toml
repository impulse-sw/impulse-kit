[workspace]
members = [
  "cc-utils",
  "cc-server-kit",
  "cc-server-kit-dsl",
  "cc-static-server",
  "cc-ui-kit",
  "cc-error-pages",
]
resolver = "2"

[workspace.package]
version = "0.11.0-beta.4"
edition = "2024"
license = "MIT"
authors = ["Klimenty Titov <aclo.create@gmail.com>"]

[workspace.dependencies]
cc-server-kit = { path = "cc-server-kit", default-features = false }
cc-static-server = { path = "cc-static-server" }
cc-utils = { path = "cc-utils", default-features = false }
cc-ui-kit = { path = "cc-ui-kit" }

anyhow = "1"
brotli = { version = "7", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1"
dashmap = "6.1"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false }
fs-change-notifier = "0.1.2"
http-body-util = "0.1"
icondata = { version = "0.5", default-features = false }
leptos = { version = "0.7", default-features = false }
leptos_i18n = { version = "0.5", default-features = false }
leptos_meta = "0.7"
leptos_router = "0.7"
leptos-use = { version = "0.15.5", default-features = false }
log = "0.4"
mime = "0.3"
notify = "8.0"
opentelemetry = "0.29"
opentelemetry-otlp = { version = "0.29", default-features = false }
opentelemetry_sdk = { version = "0.29", default-features = false }
reqwest = { version = "0.12", default-features = false }
rmp-serde = "1.3"
rustls = "0.23"
salvo = { git = "https://github.com/markcda/salvo.git", branch = "fix/oapi-scalar-api-path", default-features = false }
serde = { version = "1", default-features = false }
serde_yaml = "0.9"
smart-patcher = { git = "https://github.com/impulse-sw/smart-patcher.git", tag = "0.2.1", default-features = false }
sonic-rs = "0.5.1"
thaw = { git = "https://github.com/impulse-sw/thaw.git", tag = "0.4.5-ui-kit-3", default-features = false }
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-ecs = { git = "https://github.com/impulse-sw/tracing-ecs.git", tag = "0.4.2" }
tracing-opentelemetry = "0.30"
tracing-rfc-5424 = "0.1.4"
tracing-subscriber = "0.3"
zstd = { version = "0.13", default-features = false }
web-sys = { version = "0.3", default-features = false }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
