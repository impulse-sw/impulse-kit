cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
  "impulse-utils",
  "impulse-server-kit",
  "impulse-server-kit-dsl",
  "impulse-static-server",
  "impulse-ui-kit",
  "impulse-ui-kit/components",
  "impulse-ui-kit/examples/showcase",
  "impulse-error-pages",
]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha.11"
edition = "2024"
license = "MIT"
authors = ["Klimenty Titov <aclo.create@gmail.com>"]

[workspace.dependencies]
impulse-server-kit = { version = "1.0.0-alpha.11", path = "impulse-server-kit", default-features = false }
impulse-static-server = { version = "1.0.0-alpha.11", path = "impulse-static-server" }
impulse-utils = { version = "1.0.0-alpha.11", path = "impulse-utils", default-features = false }
impulse-ui-kit = { version = "1.0.0-alpha.11", path = "impulse-ui-kit" }
impulse-ui-kit-components = { version = "1.0.0-alpha.11", path = "impulse-ui-kit/components" }

anyhow = "1"
brotli = { version = "7", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false }
fs-change-notifier = "0.1.3"
headers = "0.4"
http = "1"
http-body-util = "0.1"
icondata = { version = "0.5", default-features = false }
leptos = { version = "0.8.12", default-features = false }
leptos_meta = "0.8"
leptos-use = { version = "0.16", default-features = false }
log = "0.4"
mime = "0.3"
notify = "8.0"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false }
opentelemetry_sdk = { version = "0.31", default-features = false }
reqwest = { version = "0.12", default-features = false }
rmp-serde = "1.3"
rustls = "0.23"
salvo = { version = "^0.89.1", default-features = false }
serde = { version = "1", default-features = false }
serde_pretty_yaml = "0.9.37"
smart-patcher = { version = "0.3.0-1", default-features = false }
sonic-rs = "0.5.1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-ecs = "0.5"
tracing-opentelemetry = "0.32"
tracing-rfc-5424 = "0.1.4"
tracing-subscriber = "0.3"
zstd = { version = "0.13", default-features = false }
web-sys = { version = "0.3.82", default-features = false }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = true
incremental = false
