[package]
name = "impulse-server-kit"
description = "Highly configurable backend framework based on `salvo`"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["http3", "cors", "acme", "oapi", "otel", "telemetry", "force-https"]
http3 = ["salvo/quinn"]
acme = ["salvo/acme"]
cors = ["salvo/cors"]
websocket = ["salvo/websocket"]
otel = ["salvo/otel", "dep:opentelemetry", "dep:reqwest", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
oapi = ["salvo/oapi"]
telemetry = ["impulse-utils/telemetry"]
proxy = ["salvo/proxy", "reqwest/stream"]
reqwest-http3 = ["reqwest/http3"]
log-without-filtering = []
flash = ["salvo/flash"]
force-https = ["salvo/force-https"]
jwt-auth = ["salvo/jwt-auth"]
basic-auth = ["salvo/basic-auth"]
cache = ["salvo/cache"]
caching-headers = ["salvo/caching-headers"]
catch-panic = ["salvo/catch-panic"]
compression = ["salvo/compression"]
concurrency-limiter = ["salvo/concurrency-limiter"]
csrf = ["salvo/csrf"]
request-id = ["salvo/request-id"]
session = ["salvo/session"]
size-limiter = ["salvo/size-limiter"]
sse = ["salvo/sse"]
static-server = [
  "dep:fs-change-notifier",
  "dep:headers",
  "dep:mime",
]
test = [
  "salvo/test",
  "dep:bytes",
  "dep:encoding_rs",
  "dep:http-body-util",
  "dep:brotli",
  "dep:flate2",
  "dep:mime",
  "dep:zstd",
  "dep:sonic-rs",
  "dep:rmp-serde",
]
timeout = ["salvo/timeout"]
trailing-slash = ["salvo/trailing-slash"]
tower-compat = ["salvo/tower-compat"]
leptos-ssr = [
  "static-server",
  "dep:leptos",
  "dep:leptos_meta",
  "dep:leptos_integration_utils",
  "dep:hydration_context",
  "dep:tachys",
  "dep:futures",
  "dep:cookie",
  "dep:any_spawner",
  "dep:bytes",
  "dep:tokio-util",
  "tokio/sync",
  "dep:impulse-client-kit",
  "impulse-client-kit/ssr",
]
leptos-server-fn = [
  "leptos-ssr",
  "dep:server_fn",
  "dep:bytes",
  "dep:http",
  "dep:http-body-util",
  "dep:axum",
  "http-body-util/default",
]
full = [
  "http3",
  "acme",
  "cors",
  "websocket",
  "otel",
  "oapi",
  "telemetry",
  "proxy",
  "reqwest-http3",
  "flash",
  "force-https",
  "jwt-auth",
  "basic-auth",
  "cache",
  "caching-headers",
  "catch-panic",
  "compression",
  "concurrency-limiter",
  "csrf",
  "request-id",
  "session",
  "size-limiter",
  "sse",
  "static-server",
  "test",
  "timeout",
  "trailing-slash",
  "tower-compat",
]

[dependencies]
brotli = { optional = true, workspace = true, features = ["default"] }
bytes = { optional = true, workspace = true }
encoding_rs = { optional = true, workspace = true }
flate2 = { optional = true, workspace = true, features = ["default"] }
fs-change-notifier = { optional = true, workspace = true }
headers = { optional = true, workspace = true }
http-body-util = { optional = true, workspace = true }
impulse-utils = { workspace = true, features = ["salvo", "reqwest", "mresult"] }
mime = { optional = true, workspace = true }
notify = { workspace = true }
opentelemetry = { optional = true, workspace = true, features = ["metrics"] }
opentelemetry-otlp = { optional = true, workspace = true, features = ["tonic", "trace", "http-proto", "grpc-tonic", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { optional = true, workspace = true, features = ["rt-tokio"] }
reqwest = { optional = true, workspace = true, features = ["http2", "json", "rustls"] }
rmp-serde = { optional = true, workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
salvo = { workspace = true, features = ["affix-state", "aws-lc-rs", "compression", "rustls", "cookie", "server", "http1", "http2", "server-handle"] }
serde = { workspace = true, features = ["derive"] }
serde_pretty_yaml = { workspace = true }
sonic-rs = { optional = true, workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-ecs = { workspace = true }
tracing-opentelemetry = { optional = true, workspace = true }
tracing-rfc-5424 = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = { optional = true, workspace = true, features = ["default"] }
leptos = { workspace = true, optional = true, features = ["ssr"] }
leptos_meta = { workspace = true, optional = true }
leptos_integration_utils = { version = "0.8", optional = true }
hydration_context = { version = "0.3", optional = true }
tachys = { version = "0.2", optional = true, default-features = false }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }
cookie = { version = "0.18", optional = true }
any_spawner = { version = "0.3", optional = true, features = ["tokio"] }
impulse-client-kit = { workspace = true, optional = true }
server_fn = { version = "0.8.12", optional = true, default-features = false, features = ["axum-no-default", "msgpack", "cbor"] }
http = { version = "1", optional = true }
axum = { version = "0.8", optional = true, default-features = false }

[package.metadata.cargo-all-features]
denylist = ["flash", "cache", "compression", "csrf", "session", "jwt-auth", "basic-auth", "caching-headers", "catch-panic", "concurrency-limiter", "request-id", "size-limiter", "sse", "static-server", "timeout", "trailing-slash", "tower-compat", "reqwest-http3", "websocket", "proxy", "leptos-ssr", "leptos-server-fn"]
