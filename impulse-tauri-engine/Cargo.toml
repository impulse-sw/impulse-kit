[package]
name = "impulse-tauri-engine"
description = "Reusable offline-first engine for Tauri apps: forwards requests to the server when online, serves them from a local store (an app-supplied LocalBackend) when offline, and replays a persistent write queue on reconnect. Native (non-wasm) only."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["executor"]
# Provides `ExecutorRemote`, the production `Remote` that runs the real requests
# natively via reqwest (this is the native side of a Tauri app — the "forward to
# the server" transport). Turn it off for headless tests that inject a fake
# `Remote`.
executor = ["dep:reqwest", "impulse-endpoint/reqwest"]

[dependencies]
impulse-endpoint = { workspace = true }
impulse-utils = { workspace = true, features = ["cresult", "mresult"] }
reqwest = { workspace = true, optional = true, features = ["json", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
