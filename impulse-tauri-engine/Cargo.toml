[package]
name = "impulse-tauri-engine"
description = "Reusable offline-first engine for Tauri apps: forwards requests to the server when online, serves them from a local store (an app-supplied LocalBackend) when offline, and replays a persistent write queue on reconnect. Native (non-wasm) only."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["executor"]
# Provides `ExecutorRemote`, the production `Remote` backed by the kit's native
# reqwest executor (`impulse-tauri-client`). Turn it off for headless tests that
# inject a fake `Remote`.
executor = ["dep:impulse-tauri-client", "impulse-tauri-client/tauri-executor"]

[dependencies]
impulse-endpoint = { workspace = true }
impulse-utils = { workspace = true, features = ["cresult", "mresult"] }
impulse-tauri-client = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
