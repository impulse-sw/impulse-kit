[package]
name = "impulse-client-kit-components"
description = "Generic components for Client Kit"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
build = "build.rs"
# Lets `build.rs` publish the component sources' path to dependents via
# `DEP_IMPULSE_CLIENT_KIT_COMPONENTS_{STYLES,SOURCE_DIR}` so Tailwind can scan them.
links = "impulse-client-kit-components"

[build-dependencies]
impulse-tailwind-sources = { workspace = true }

[features]
default = ["csr"]
csr = [
  "impulse-client-kit/csr",
  "leptos/csr",
  "leptos-use/storage",
]
hydrate = [
  "impulse-client-kit/hydrate",
  "leptos/hydrate",
  "leptos-use/storage",
]
ssr = [
  "impulse-client-kit/ssr",
  "leptos/ssr",
  "leptos-use/ssr",
  "leptos-use/storage",
]

[dependencies]
chrono = "0.4.42"
codee = "0.3.3"
icondata = { workspace = true }
impulse-client-kit = { workspace = true }
# `back` reads and writes the history entry's state object, which is a bare
# `JsValue` — `Object`/`Reflect` are what put a namespaced key on it and read it
# back without clobbering whatever else lives there.
js-sys = "0.3"
leptos = { version = "0.8", default-features = false }
# `use_resize_observer` keeps an auto-sizing `Textarea` honest when the field's
# width changes: the same text wraps into more lines in a narrower box, and
# nothing in the value says so. leptos-use gates every hook behind a feature of
# its own name, and this one is used unconditionally, so it belongs here rather
# than in the csr/hydrate/ssr lists.
leptos-use = { version = "0.16", default-features = false, features = ["use_resize_observer"] }
uuid = { version = "1.18.1", features = ["v4", "js"] }
web-sys = { version = "0.3.82", features = [
  "ClipboardEvent",
  # An auto-sizing `Textarea` reads the `max-height` it was given in CSS, so it
  # can be told to stop at the screen rather than at a line count. That is
  # `Window::get_computed_style`, which is gated on all three of `Window`,
  # `Element` and `CssStyleDeclaration` — the last of which also carries the
  # `HtmlElement::style` every measured height is written through. They were all
  # reaching this crate through some dependent's feature list until now.
  "CssStyleDeclaration",
  "DataTransfer",
  "DragEvent",
  # `dnd` hit-tests the pointer against the drop zones under it on every move —
  # a captured pointer stops firing `pointerover` on anything else, so
  # `Document::element_from_point` is how a drop target is found at all.
  "Document",
  "DomRect",
  "Element",
  # `back` listens for `popstate`/`keydown` on the window and pushes an entry per
  # open layer, which is how the Android back button reaches a Leptos signal.
  "EventTarget",
  "History",
  "HtmlButtonElement",
  "HtmlDivElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "NodeList",
  # `dnd` times the press that turns into a touch drag on the monotonic clock.
  "Performance",
  "PointerEvent",
  "Window",
  "Clipboard",
] }
