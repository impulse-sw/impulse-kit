[package]
name = "impulse-client-kit-blocks"
description = "Higher-level UI blocks (markdown, charts, graphs, …) composed from Client Kit components"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
build = "build.rs"
# Lets `build.rs` publish this crate's sources — plus the forwarded
# `impulse-client-kit-components` ones — to dependents via
# `DEP_IMPULSE_UI_KIT_BLOCKS_{STYLES,SOURCE_DIR}` so Tailwind can scan them.
links = "impulse-client-kit-blocks"

[build-dependencies]
impulse-tailwind-sources = { workspace = true }

[features]
default = ["csr"]
csr = [
  "impulse-client-kit/csr",
  "impulse-client-kit-components/csr",
  "leptos/csr",
]
hydrate = [
  "impulse-client-kit/hydrate",
  "impulse-client-kit-components/hydrate",
  "leptos/hydrate",
]
ssr = [
  "impulse-client-kit/ssr",
  "impulse-client-kit-components/ssr",
  "leptos/ssr",
]

[dependencies]
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
impulse-client-kit = { workspace = true }
impulse-client-kit-components = { workspace = true }
leptos = { version = "0.8", default-features = false }
log = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
web-sys = { workspace = true, features = [
  "DomRect",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "MouseEvent",
  "PointerEvent",
  "WheelEvent",
] }
