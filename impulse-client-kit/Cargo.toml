[package]
name = "impulse-client-kit"
description = "Powerful frontend framework based on Leptos"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["csr", "telemetry"]
# Client-side telemetry: monitor components + imperative log/metric/span helpers.
# DOM delivery is active under `csr`/`hydrate`; under `ssr` everything is a no-op.
telemetry = [
  "impulse-utils/telemetry",
  "dep:rmp-serde",
  "dep:web-sys",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "web-sys/Window",
  "web-sys/Navigator",
  "web-sys/Blob",
  "web-sys/BlobPropertyBag",
  "web-sys/Element",
  "web-sys/EventTarget",
  "web-sys/HtmlDivElement",
  "web-sys/IntersectionObserver",
  "web-sys/IntersectionObserverEntry",
]
csr = [
  "leptos/csr",
  "dep:console_error_panic_hook",
  "dep:console_log",
  "dep:web-sys",
  "dep:leptos-use",
  "leptos-use/use_color_mode",
  "web-sys/Window",
  "web-sys/Storage",
  "web-sys/Navigator",
  "web-sys/KeyboardEvent",
]
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:console_log",
  "dep:web-sys",
  "dep:leptos-use",
  "leptos-use/use_color_mode",
  "web-sys/Window",
  "web-sys/Storage",
  "web-sys/Navigator",
  "web-sys/KeyboardEvent",
]
ssr = [
  "leptos/ssr",
  "dep:leptos_meta",
]
websocket = [
  "impulse-utils/page-lifecycle",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "web-sys/BinaryType",
  "web-sys/CloseEvent",
  "web-sys/Document",
  "web-sys/EventTarget",
  "web-sys/MessageEvent",
  "web-sys/PageTransitionEvent",
  "web-sys/WebSocket",
  "web-sys/Window",
]
webtransport = [
  "impulse-utils/page-lifecycle",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "web-sys/Document",
  "web-sys/EventTarget",
  "web-sys/PageTransitionEvent",
  "web-sys/Window",
  "web-sys/ReadableStream",
  "web-sys/ReadableStreamDefaultReader",
  "web-sys/WebTransport",
  "web-sys/WebTransportBidirectionalStream",
  "web-sys/WebTransportCloseInfo",
  "web-sys/WebTransportDatagramDuplexStream",
  "web-sys/WebTransportOptions",
  "web-sys/WebTransportReceiveStream",
  "web-sys/WebTransportSendStream",
  "web-sys/WritableStream",
  "web-sys/WritableStreamDefaultWriter",
]
# Unified REST client (`client` module) with one API across two backends. The
# default backend goes out directly (reqwest — browser fetch on wasm, native
# TLS off-wasm); `tauri` swaps it for the Tauri-IPC backend. The wire types come
# from `impulse-endpoint`. Auth-agnostic: apps install a request interceptor
# (e.g. to attach an authnz token or cookies).
client = [
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:rmp-serde",
  "dep:impulse-endpoint",
  "impulse-endpoint/reqwest",
  "impulse-utils/reqwest",
]
# Route the unified client through Tauri IPC instead of hitting the network
# directly. Enable this on the wasm frontend bundled into a Tauri webview, where
# fetch/WS to arbitrary hosts don't work — requests are forwarded to the native
# engine over `invoke("ik_http_request")`. `build.rs` emits `cfg(tauri)` for both
# the REST client's IPC backend and the WebSocket bridge. The native side of a
# Tauri app (the request executor) lives in `impulse-tauri-engine`.
tauri = [
  "client",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:serde-wasm-bindgen",
]

[dependencies]
console_error_panic_hook = { workspace = true, optional = true }
console_log = { workspace = true, optional = true }
http = { workspace = true, optional = true }
impulse-utils = { workspace = true, features = ["cresult"] }
impulse-endpoint = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
leptos = { workspace = true }
leptos-use = { workspace = true, optional = true }
leptos_meta = { workspace = true, optional = true }
log = { workspace = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

# Native (off-wasm) builds add TLS + HTTP/2 to reqwest so the Tauri engine's
# `executor` can actually reach a remote server. Features union with the base.
[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
reqwest = { workspace = true, optional = true, features = ["json", "rustls", "http2"] }
