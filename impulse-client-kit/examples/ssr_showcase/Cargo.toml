[package]
name = "ssr-showcase"
description = "Server-rendered + hydrated demo of Impulse UI Kit + Server Kit"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ssr-showcase"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = []
ssr = [
  "impulse-client-kit/ssr",
  "impulse-client-kit-components/ssr",
  "leptos/ssr",
  "leptos_meta/ssr",
  "server_fn_macro_default/ssr",
  "server_fn_macro_default/axum",
  "dep:impulse-server-kit",
  "dep:tokio",
]
hydrate = [
  "impulse-client-kit/hydrate",
  "impulse-client-kit-components/hydrate",
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
]

[build-dependencies]
impulse-tailwind-sources = { workspace = true }

[dependencies]
impulse-client-kit = { workspace = true, default-features = false }
impulse-client-kit-components = { workspace = true, default-features = false }
leptos = { workspace = true }
leptos_meta = { workspace = true }
serde = { workspace = true, features = ["derive"] }
server_fn = { version = "0.8.12", default-features = false, features = ["msgpack"] }
server_fn_macro_default = { version = "0.8.5", default-features = false }
tracing = { workspace = true }

impulse-server-kit = { workspace = true, optional = true, default-features = false, features = ["leptos-server-fn", "cors", "oapi"] }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
