startup_type: http_localhost
server_port: 8802
frontend_dist_path: ./dist
leptos_output_name: ssr_showcase
leptos_seo:
  title_template: "{} | Impulse"
  default_title: UI Kit Showcase
  description: Server-rendered demo of Impulse UI Kit
  canonical_base: http://127.0.0.1:8802
  locale: en
  robots: index,follow
  twitter_handle: "@impulse"
  site_name: Impulse
  # og_image / og_logo are usually absolute URLs to brand assets; the
  # showcase keeps them unset so it does not advertise stale screenshots.
  # og_image: https://impulse.example.com/og-preview.png
  # og_logo:  https://impulse.example.com/logo-512.png
enable_io_logs: true
io_log_level: debug
