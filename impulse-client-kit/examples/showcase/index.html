<!DOCTYPE html>
<html class="bg-background">
<head>
  <link rel="stylesheet" href="/tailwind.css">
  <title>Client Kit Component Showcase - Impulse Services</title>
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <link data-trunk rel="copy-file" href="sample.md" />
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8" />
  <!--
    Blocking, render-before-paint theme reconciliation. It must read the
    explicit `theme` choice from localStorage *first* and only then fall back
    to `prefers-color-scheme`; resolving the OS preference alone paints dark
    for a user who picked light on a dark system, and the WASM `ThemeProvider`
    then strips it — the dark→light flicker. Keep the literals (`theme`,
    `dark`, `light`) in sync with impulse-client-kit-components::theme.
  -->
  <script>
    (function () {
      try {
        var e = localStorage.getItem("theme"), c = document.documentElement.classList;
        if (e === "dark" || (e !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          c.add("dark"); c.remove("light");
        } else {
          c.remove("dark"); c.add("light");
        }
      } catch (_) {}
    })();
  </script>
</head>
<body class="bg-background">
  <div id="main"></div>
</body>
</html>
