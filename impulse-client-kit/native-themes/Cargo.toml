[package]
name = "impulse-client-native-themes"
description = "Match a client webview's base neutral palette (background/foreground and surfaces) to the host system's native theme, so a Tauri app blends with the OS instead of looking like an arbitrary website. Brand tokens (accent, destructive, charts) are left untouched."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = []
# Fetch the captured native palette from the webview over Tauri IPC. Enable this
# on the wasm frontend bundled into a Tauri webview; without it the webview side
# only applies the (platform-independent) `color-scheme` hint.
tauri = ["dep:serde-wasm-bindgen", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
# The Linux desktop provider, which reads the GTK theme's named colours. Off by
# default because it links GTK 3: a consumer that only lints or builds headless
# (no Tauri desktop bundle) must not be forced to have the GTK development
# headers installed. Enable it wherever the Tauri desktop app itself is built.
gtk-desktop = ["dep:gtk"]

[dependencies]
# `std` is explicit: the workspace default is `default-features = false`, which
# leaves `String` without a `Deserialize` impl.
serde = { workspace = true, features = ["derive", "std"] }

# Webview side. `web-sys` is always needed there (stylesheet injection); the IPC
# bits come in with the `tauri` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
  "Window",
  "Document",
  "Element",
  "HtmlHeadElement",
  "Node",
] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Android native side: reads the Material You (MD3) tonal palettes via JNI.
# `jni` is pinned to the version Tauri's Android runtime uses so the shared
# JavaVM / Activity pointers line up.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Linux desktop side, behind `gtk-desktop`. The version matches the GTK 3 stack
# Tauri's own Linux backend links, so no second GTK ends up in the graph.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
