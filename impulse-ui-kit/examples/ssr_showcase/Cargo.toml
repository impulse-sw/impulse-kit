[package]
name = "ssr-showcase"
description = "Server-rendered demo of Impulse UI Kit + Server Kit"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
impulse-server-kit = { workspace = true, default-features = false, features = ["leptos-ssr", "cors", "oapi"] }
impulse-ui-kit = { workspace = true, features = ["ssr"] }
impulse-ui-kit-components = { workspace = true, features = ["ssr"] }
leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
