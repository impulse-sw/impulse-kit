# The static server listens on the set of protocols declared below.
#
# Each `http1` / `http2` / `http3` entry needs a host and port; `http3`
# additionally needs a TLS key and certificate. An `impulse-ring` entry is
# served over the shared-memory Ring bus and only needs an application name
# (the `impulsed` broker must be running).
protocols:
  - type: http1
    host: 0.0.0.0
    port: 8807
  # Serve the same content over shared memory in addition to TCP. Uncomment to
  # enable (requires the `impulsed` broker and the `impulse-ring` feature):
  # - type: impulse-ring
  #   app_name: static-server
enable_io_logs: true
io_log_level: info
