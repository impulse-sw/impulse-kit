[package]
name = "impulse-client-ring"
description = "reqwest-style HTTP client over the Ring shared-memory IPC bus (impulse-ring)"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["async"]
# Adds the `RequestBuilder::send` async method (and pulls in a Tokio runtime
# handle for `spawn_blocking`). The blocking API is always available.
async = ["dep:tokio"]

[dependencies]
impulse-ring-connector = { workspace = true }
impulse-ring-http = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt"] }

[dev-dependencies]
# The server example listens over Ring via `impulse-server-kit`'s listener.
impulse-server-kit = { workspace = true, features = ["impulse-ring", "oapi"] }
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[[example]]
name = "ring-server"
path = "examples/server.rs"

[[example]]
name = "ring-cli"
path = "examples/cli.rs"
