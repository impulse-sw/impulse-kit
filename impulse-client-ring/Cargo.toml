[package]
name = "impulse-client-ring"
description = "reqwest-style HTTP client over the Ring shared-memory IPC bus (impulse-ring)"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["async"]
# Adds the `RequestBuilder::send` async method (and pulls in a Tokio runtime
# handle for `spawn_blocking`). The blocking API is always available.
#
# It also enables the streaming/upgrade client (`streaming` module: SSE,
# WebSocket and WebTransport over Ring channels), which needs Tokio's IO and
# sync primitives to bridge the blocking bus to async byte streams.
async = ["dep:tokio", "dep:bytes", "dep:futures-core"]

[dependencies]
impulse-ring-connector = { workspace = true }
impulse-ring-http = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "io-util", "time"] }
bytes = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }

[dev-dependencies]
# The server example listens over Ring via `impulse-server-kit`'s listener.
impulse-server-kit = { workspace = true, features = ["impulse-ring", "oapi", "sse", "websocket"] }
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[[example]]
name = "ring-server"
path = "examples/server.rs"

[[example]]
name = "ring-cli"
path = "examples/cli.rs"
