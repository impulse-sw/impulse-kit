actions:
  - info: add-static-server-to-storage@0.1.0
    action:
      type: add_to_storage
      short_name: static-server
      auto_version_rule:
        type: cmd_stdout
        cmd:
          cmd: python .depl/rust_crate_ver.py
          ignore_fails: true
          show_cmd: false
          only_when_fresh: false
      content:
        type: fixed_files
        placements:
          - from: target/x86_64-unknown-linux-gnu/release/iks
            to: iks
          - from: impulse-static-server/static-server.yaml
            to: static-server.yaml
  - info: cargo-fmt@0.1.0
    exec_in_project_dir: true
    skip_sync: false
    action:
      type: staged
      stage: build
      cmd: cargo fmt -- --config tab_spaces=2,max_width=120 $(find . -name "*.rs" -not -path "*/target/*")
  - info: cargo-generate-doc@0.1.0
    action:
      type: staged
      stage: build
      cmd: cargo doc --target {target} --workspace --no-deps
      placeholders:
        - "{target}"
  - info: cargo-install-by-copy@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp -f %bin% ~/.cargo/bin
      placeholders:
        - "%bin%"
  - info: cargo-lint@0.2.0
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo clippy --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
  - info: cargo-publish@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: deploy
      cmd: cargo publish --package {package}{features}
      placeholders:
        - "{package}"
        - "{features}"
  - info: cargo-release@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo build --release --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
  - info: cargo-test-doc@0.1.0
    requirements:
      - type: in_path
        executable: cargo
    action:
      type: staged
      stage: build
      cmd: cargo test --doc
  - info: copy@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp {from} {to}
      placeholders:
        - "{from}"
        - "{to}"
  - info: depl-add-component-to-storage@0.1.0
    tags:
      - deployer
    requirements:
      - type: in_path
        executable: depl
    action:
      type: staged
      stage: build
      cmd: depl add content -o -c impulse-ui-kit/components/src/{component-file}.rs -p ui-kit-{component-name}@{kit-version}
      placeholders:
        - "{component-name}"
        - "{component-file}"
        - "{kit-version}"
  - info: impulse-kit-patch-cargo@0.1.0
    action:
      type: patch
      patch: .depl/patch-cargo-toml.json
  - info: leptos-fmt@0.1.0
    tags:
      - leptos
      - fmt
    requirements:
      - type: in_path
        executable: leptosfmt
        desc: "Check this: https://github.com/bram209/leptosfmt"
    exec_in_project_dir: true
    action:
      type: staged
      stage: build
      cmd: leptosfmt -t 2 ./**/*.rs
  - info: run-showcase-static-server@0.1.0
    action:
      type: observe
      cmd: cd impulse-ui-kit/examples/showcase && ./iks
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: sync-static-server@0.1.0
    action:
      type: use_from_storage
      content_info: static-server@latest
  - info: sync-static-server@0.1.1
    action:
      type: staged
      stage: build
      cmd: mv iks static-server.yaml impulse-ui-kit/examples/showcase
  - info: tailwindcss-compile@0.2.0
    tags:
      - tailwind
      - css
    requirements:
      - type: in_path
        executable: tailwindcss
        desc: "Install TailwindCSS standalone client: https://github.com/tailwindlabs/tailwindcss/releases"
      - type: exists
        path: ./impulse-error-pages/tw-animate.css
        desc: "Download `tw-animate` manually from: https://raw.githubusercontent.com/Wombosvideo/tw-animate-css/refs/heads/main/src/tw-animate.css"
    action:
      type: staged
      stage: build
      cmd: tailwindcss -i {tw-input} -o {tw-output} --minify
      placeholders:
        - "{tw-input}"
        - "{tw-output}"
  - info: trunk-build-rel@0.1.0
    tags:
      - trunk
      - build
      - wasm
    requirements:
      - type: in_path
        executable: trunk
        desc: "Check the website: https://trunkrs.dev/"
    action:
      type: staged
      stage: build
      cmd: cd {project-folder} && RUSTFLAGS="-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort" CARGO_UNSTABLE_BUILD_STD="std,panic_abort" CARGO_UNSTABLE_BUILD_STD_FEATURES="optimize_for_size" trunk build --release
      placeholders:
        - "{project-folder}"
  - info: upx@0.1.0
    requirements:
      - type: in_path
        executable: upx
    action:
      type: staged
      stage: build
      cmd: upx %af%
      placeholders:
        - "%af%"
  - info: use-rust-package-version@0.1.0
    action:
      type: use_from_storage
      content_info: get-know-rust-package-version@latest
  - info: wasm-opt@0.1.0
    tags:
      - wasm
      - wasm-opt
    requirements:
      - type: in_path
        executable: wasm-opt
        desc: "Install `binaryen` package or download it from this: https://github.com/WebAssembly/binaryen/releases"
    action:
      type: staged
      stage: build
      cmd: wasm-opt -Oz --all-features --strip-debug --strip-producers -o {file} {file}
      placeholders:
        - "{file}"
  - info: wasm-prepare-showcase-dist-folder@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp {tw-output} {favicon} impulse-ui-kit/examples/showcase/dist/
      placeholders:
        - "{tw-output}"
        - "{favicon}"
  - info: wasm-strip@0.1.0
    requirements:
      - type: in_path
        executable: wasm-strip
        desc: "Install `binaryen` package or download it from this: https://github.com/WebAssembly/binaryen/releases"
    action:
      type: staged
      stage: build
      cmd: wasm-strip {file}
      placeholders:
        - "{file}"
pipelines:
  - title: lints
    desc: Lints for Impulse Kit
    info: impulse-kit-lints@0.1.0
    tags:
      - cargo
      - clippy
      - lint
      - docs
    actions:
      - title: Lint `impulse-utils` on x86-64
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-x86
      - title: Lint `impulse-utils` on wasm32
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-utils-wasm32
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit` with `websocket`/`webtransport`
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ui-kit-net
          "{flags}": web-sys-unstable-flag
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `showcase`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-showcase
          "{target}": target-wasm
      - title: Lint `impulse-error-pages`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: Lint `impulse-server-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-server-kit
          "{target}": target-x86
      - title: Lint `impulse-server-kit-dsl`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-dsl
          "{target}": target-x86
      - title: Lint `impulse-static-server`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Test docs
        used: cargo-test-doc@0.1.0
    driver: shell
    gh_opts:
      on_push_branches:
        - stable
        - unstable
      on_pull_requests_branches:
        - unstable
      preflight_steps:
        - name: Install Rust Toolchain for x86_64
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            target: x86_64-unknown-linux-gnu
            toolchain: nightly
            components: clippy
        - name: Install Rust Toolchain for WASM
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            target: wasm32-unknown-unknown
            toolchain: nightly
            components: clippy
  - title: common-ops
    desc: Common monorepo operations
    info: impulse-kit-common-ops@0.1.0
    tags:
      - cargo
      - clippy
      - lint
      - docs
      - fmt
    default: true
    actions:
      - title: Lint `impulse-utils` on x86-64
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-x86
      - title: Lint `impulse-utils` on wasm32
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-utils-wasm32
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit` with `websocket`/`webtransport`
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ui-kit-net
          "{flags}": web-sys-unstable-flag
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `showcase`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-showcase
          "{target}": target-wasm
      - title: Lint `impulse-error-pages`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: Lint `impulse-server-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-server-kit
          "{target}": target-x86
      - title: Lint `impulse-server-kit-dsl`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-dsl
          "{target}": target-x86
      - title: Lint `impulse-static-server`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Format
        used: cargo-fmt@0.1.0
      - title: Test docs
        used: cargo-test-doc@0.1.0
      - title: Generate docs
        used: cargo-generate-doc@0.1.0
        with:
          "{target}": target-x86
    artifacts:
      - from: target/x86_64-unknown-linux-gnu/doc
        to: docs
  - title: publish
    desc: Publish open-source libraries
    info: impulse-kit-publish@0.1.0
    tags:
      - cargo
      - publish
    default: false
    actions:
      - title: Publish `impulse-utils`
        used: cargo-publish@0.2.0
        with:
          "{features}": featureset-all
          "{package}": package-utils
      - title: Publish `impulse-ui-kit`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-ui-kit
      - title: Publish `impulse-server-kit`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-server-kit
      - title: Publish `impulse-static-server`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-static-server
  - title: export-ui-components
    desc: Export Impulse UI Kit components to Deployer's storage.
    info: impulse-kit-export-ui-kit-components@0.1.0
    tags:
      - deployer
      - components
      - ui-kit
    actions:
      - title: Add script to know Impulse Kit version
        used: use-rust-package-version@0.1.0
      - title: Lint components
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-components
          "{target}": target-wasm
      - title: Format `leptos::view!` macro content
        used: leptos-fmt@0.1.0
      - title: Format components before exporting
        used: cargo-fmt@0.1.0
      - title: Add `accordion` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-accordion
          "{component-name}": component-accordion
          "{kit-version}": kit-version
      - title: Add `alert-dialog` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-alert-dialog
          "{component-name}": component-alert-dialog
          "{kit-version}": kit-version
      - title: Add `alert` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-alert
          "{component-name}": component-alert
          "{kit-version}": kit-version
      - title: Add `aspect-ratio` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-aspect-ratio
          "{component-name}": component-aspect-ratio
          "{kit-version}": kit-version
      - title: Add `avatar` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-avatar
          "{component-name}": component-avatar
          "{kit-version}": kit-version
      - title: Add `badge` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-badge
          "{component-name}": component-badge
          "{kit-version}": kit-version
      - title: Add `breadcrumb` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-breadcrumb
          "{component-name}": component-breadcrumb
