project_name: impulse-kit
version: 9
ignore_files:
  - .*.kate-swp
  - .git
  - target
cache_files:
  - target
variables:
  binary-dsl:
    value:
      type: plain
      value: target/x86_64-unknown-linux-gnu/release/skdsl
  binary-ssr-showcase:
    value:
      type: plain
      value: target/x86_64-unknown-linux-gnu/release/ssr-showcase
  binary-static-server:
    value:
      type: plain
      value: target/x86_64-unknown-linux-gnu/release/iks
  empty:
    value:
      type: plain
      value: ""
  error-pages-tw-input:
    value:
      type: plain
      value: ./impulse-error-pages/input.css
  error-pages-tw-output:
    value:
      type: plain
      value: ./impulse-error-pages/dist/error_pages_tailwind.css
  error-pages-wasm-file:
    value:
      type: plain
      value: ./impulse-error-pages/dist/impulse-error-pages_bg.wasm
  featureset-all:
    value:
      type: plain
      value: " --all-features"
  featureset-ssr-showcase-hydrate:
    value:
      type: plain
      value: " --no-default-features --features=hydrate"
  featureset-ssr-showcase-server:
    value:
      type: plain
      value: " --no-default-features --features=ssr"
  featureset-ui-kit-net:
    value:
      type: plain
      value: " --features=websocket,webtransport"
  featureset-utils-wasm32:
    value:
      type: plain
      value: " --no-default-features --features=reqwest"
  file-error-pages-favicon:
    value:
      type: plain
      value: impulse-error-pages/public/favicon.ico
  folder-error-pages:
    value:
      type: plain
      value: impulse-error-pages/
  folder-error-pages-dist:
    value:
      type: plain
      value: impulse-error-pages/dist/
  folder-showcase:
    value:
      type: plain
      value: impulse-ui-kit/examples/showcase/
  folder-ssr-showcase:
    value:
      type: plain
      value: impulse-ui-kit/examples/ssr_showcase/
  kit-version:
    value:
      type: from_cmd
      cmd: python .depl/rust_crate_ver.py
  package-dsl:
    value:
      type: plain
      value: impulse-skdsl
  package-error-pages:
    value:
      type: plain
      value: impulse-error-pages
  package-server-kit:
    value:
      type: plain
      value: impulse-server-kit
  package-ssr-showcase:
    value:
      type: plain
      value: ssr-showcase
  package-static-server:
    value:
      type: plain
      value: impulse-static-server
  package-ui-kit:
    value:
      type: plain
      value: impulse-ui-kit
  package-ui-kit-components:
    value:
      type: plain
      value: impulse-ui-kit-components
  package-ui-kit-showcase:
    value:
      type: plain
      value: ui-kit-showcase
  package-utils:
    value:
      type: plain
      value: impulse-utils
  reqwest-unstable-flag:
    value:
      type: plain
      value: 'RUSTFLAGS=''--cfg reqwest_unstable'' '
  showcase-favicon:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/showcase/public/favicon.ico
  showcase-tw-input:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/showcase/input.css
  showcase-tw-output:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/showcase/public/tailwind.css
  showcase-wasm-file:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/showcase/dist/ui-kit-showcase_bg.wasm
  ssr-showcase-dist-folder:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/ssr_showcase/dist/pkg
  ssr-showcase-dist-pkg-folder:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/ssr_showcase/dist/pkg
  ssr-showcase-tw-input:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/ssr_showcase/input.css
  ssr-showcase-tw-output:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/ssr_showcase/dist/pkg/ssr_showcase.css
  ssr-showcase-wasm-bg-file:
    value:
      type: plain
      value: ./impulse-ui-kit/examples/ssr_showcase/dist/pkg/ssr_showcase_bg.wasm
  ssr-showcase-wasm-file:
    value:
      type: plain
      value: ./target/wasm32-unknown-unknown/release/ssr_showcase.wasm
  ssr-showcase-wasm-out-name:
    value:
      type: plain
      value: ssr_showcase
  target-wasm:
    value:
      type: plain
      value: wasm32-unknown-unknown
  target-x86:
    value:
      type: plain
      value: x86_64-unknown-linux-gnu
  web-sys-unstable-flag:
    value:
      type: plain
      value: 'RUSTFLAGS=''--cfg web_sys_unstable_apis'' '
actions:
  - info: add-static-server-to-storage@0.1.0
    action:
      type: add_to_storage
      short_name: static-server
      auto_version_rule:
        type: cmd_stdout
        cmd:
          cmd: python .depl/rust_crate_ver.py
          ignore_fails: true
          show_cmd: false
          only_when_fresh: false
      content:
        type: fixed_files
        placements:
          - from: target/x86_64-unknown-linux-gnu/release/iks
            to: iks
          - from: impulse-static-server/static-server.yaml
            to: static-server.yaml
  - info: cargo-fmt@0.1.0
    exec_in_project_dir: true
    skip_sync: false
    action:
      type: staged
      stage: build
      cmd: cargo fmt -- --config tab_spaces=2,max_width=120 $(find . -name "*.rs" -not -path "*/target/*")
  - info: cargo-generate-doc@0.1.0
    action:
      type: staged
      stage: build
      cmd: cargo doc --target {target} --workspace --no-deps
      placeholders:
        - "{target}"
  - info: cargo-install-by-copy@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp -f %bin% ~/.cargo/bin
      placeholders:
        - "%bin%"
  - info: cargo-lint@0.2.0
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo clippy --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
      show_success_output: true
  - info: cargo-publish@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: deploy
      cmd: cargo publish --package {package}{features}
      placeholders:
        - "{package}"
        - "{features}"
  - info: cargo-release@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo build --release --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
  - info: cargo-test-doc@0.1.0
    requirements:
      - type: in_path
        executable: cargo
    action:
      type: staged
      stage: build
      cmd: cargo test --doc
  - info: cargo-wasm-rel@0.1.0
    tags:
      - rust
      - cargo
      - wasm
    requirements:
      - type: in_path
        executable: cargo
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo build --release --lib --package {package} --target wasm32-unknown-unknown{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{features}"
  - info: copy@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp {from} {to}
      placeholders:
        - "{from}"
        - "{to}"
  - info: depl-add-component-to-storage@0.1.0
    tags:
      - deployer
    requirements:
      - type: in_path
        executable: depl
    action:
      type: staged
      stage: build
      cmd: depl add content -o -c impulse-ui-kit/components/src/{component-file}.rs -p ui-kit-{component-name}@{kit-version}
      placeholders:
        - "{component-name}"
        - "{component-file}"
        - "{kit-version}"
  - info: impulse-kit-patch-cargo@0.1.0
    action:
      type: patch
      patch: .depl/patch-cargo-toml.json
  - info: leptos-fmt@0.1.0
    tags:
      - leptos
      - fmt
    requirements:
      - type: in_path
        executable: leptosfmt
        desc: "Check this: https://github.com/bram209/leptosfmt"
    exec_in_project_dir: true
    action:
      type: staged
      stage: build
      cmd: leptosfmt -t 2 ./**/*.rs
  - info: mkdir@0.1.0
    action:
      type: custom
      cmd: mkdir -p {folder}
      placeholders:
        - "{folder}"
  - info: run-showcase-static-server@0.1.0
    action:
      type: observe
      cmd: cd impulse-ui-kit/examples/showcase && ./iks
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: run-ssr-showcase-server@0.1.0
    action:
      type: observe
      cmd: cd impulse-ui-kit/examples/ssr_showcase && ../../../target/x86_64-unknown-linux-gnu/release/ssr-showcase
      ignore_fails: true
      show_success_output: true
      show_cmd: false
      only_when_fresh: false
  - info: sync-static-server@0.1.0
    action:
      type: use_from_storage
      content_info: static-server@latest
  - info: sync-static-server@0.1.1
    action:
      type: staged
      stage: build
      cmd: mv iks static-server.yaml impulse-ui-kit/examples/showcase
  - info: tailwindcss-compile@0.2.0
    tags:
      - tailwind
      - css
    requirements:
      - type: in_path
        executable: tailwindcss
        desc: "Install TailwindCSS standalone client: https://github.com/tailwindlabs/tailwindcss/releases"
      - type: exists
        path: ./impulse-error-pages/tw-animate.css
        desc: "Download `tw-animate` manually from: https://raw.githubusercontent.com/Wombosvideo/tw-animate-css/refs/heads/main/src/tw-animate.css"
    action:
      type: staged
      stage: build
      cmd: tailwindcss -i {tw-input} -o {tw-output} --minify
      placeholders:
        - "{tw-input}"
        - "{tw-output}"
  - info: trunk-build-rel@0.1.0
    tags:
      - trunk
      - build
      - wasm
    requirements:
      - type: in_path
        executable: trunk
        desc: "Check the website: https://trunkrs.dev/"
    action:
      type: staged
      stage: build
      cmd: cd {project-folder} && RUSTFLAGS="-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort" CARGO_UNSTABLE_BUILD_STD="std,panic_abort" CARGO_UNSTABLE_BUILD_STD_FEATURES="optimize_for_size" trunk build --release
      placeholders:
        - "{project-folder}"
  - info: upx@0.1.0
    requirements:
      - type: in_path
        executable: upx
    action:
      type: staged
      stage: build
      cmd: upx %af%
      placeholders:
        - "%af%"
  - info: use-rust-package-version@0.1.0
    action:
      type: use_from_storage
      content_info: get-know-rust-package-version@latest
  - info: wasm-bindgen-cli@0.1.0
    tags:
      - wasm
      - wasm-bindgen
    requirements:
      - type: in_path
        executable: wasm-bindgen
        desc: "Install: cargo install wasm-bindgen-cli"
    action:
      type: staged
      stage: build
      cmd: wasm-bindgen --target web --out-dir {out-dir} --out-name {out-name} {wasm-file}
      placeholders:
        - "{out-dir}"
        - "{out-name}"
        - "{wasm-file}"
  - info: wasm-opt@0.1.0
    tags:
      - wasm
      - wasm-opt
    requirements:
      - type: in_path
        executable: wasm-opt
        desc: "Install `binaryen` package or download it from this: https://github.com/WebAssembly/binaryen/releases"
    action:
      type: staged
      stage: build
      cmd: wasm-opt -Oz --all-features --strip-debug --strip-producers -o {file} {file}
      placeholders:
        - "{file}"
  - info: wasm-prepare-showcase-dist-folder@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp {tw-output} {favicon} impulse-ui-kit/examples/showcase/dist/
      placeholders:
        - "{tw-output}"
        - "{favicon}"
  - info: wasm-strip@0.1.0
    requirements:
      - type: in_path
        executable: wasm-strip
        desc: "Install `binaryen` package or download it from this: https://github.com/WebAssembly/binaryen/releases"
    action:
      type: staged
      stage: build
      cmd: wasm-strip {file}
      placeholders:
        - "{file}"
pipelines:
  - title: lints
    desc: Lints for Impulse Kit
    info: impulse-kit-lints@0.1.0
    tags:
      - cargo
      - clippy
      - lint
      - docs
    actions:
      - title: Lint `impulse-utils` on x86-64
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-x86
      - title: Lint `impulse-utils` on wasm32
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-utils-wasm32
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit` with `websocket`/`webtransport`
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ui-kit-net
          "{flags}": web-sys-unstable-flag
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `showcase`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-showcase
          "{target}": target-wasm
      - title: Lint `ssr-showcase` wasm
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ssr-showcase-hydrate
          "{flags}": empty
          "{package}": package-ssr-showcase
          "{target}": target-wasm
      - title: Lint `impulse-error-pages`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: Lint `impulse-server-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-server-kit
          "{target}": target-x86
      - title: Lint `impulse-server-kit-dsl`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-dsl
          "{target}": target-x86
      - title: Lint `impulse-static-server`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Lint `ssr-showcase` server
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ssr-showcase-server
          "{flags}": empty
          "{package}": package-ssr-showcase
          "{target}": target-x86
      - title: Test docs
        used: cargo-test-doc@0.1.0
    gh_opts:
      on_push_branches:
        - stable
        - unstable
      on_pull_requests_branches:
        - unstable
      preflight_steps:
        - name: Install Rust Toolchain for x86_64
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            target: x86_64-unknown-linux-gnu
            toolchain: nightly
            components: clippy
        - name: Install Rust Toolchain for WASM
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            target: wasm32-unknown-unknown
            toolchain: nightly
            components: clippy
  - title: common-ops
    desc: Common monorepo operations
    info: impulse-kit-common-ops@0.1.0
    tags:
      - cargo
      - clippy
      - lint
      - docs
      - fmt
    default: true
    actions:
      - title: Format
        used: cargo-fmt@0.1.0
      - title: Lint `impulse-utils` on x86-64
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-x86
      - title: Lint `impulse-utils` on wasm32
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-utils-wasm32
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit` with `websocket`/`webtransport`
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ui-kit-net
          "{flags}": web-sys-unstable-flag
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `showcase`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-showcase
          "{target}": target-wasm
      - title: Lint `ssr-showcase` wasm
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ssr-showcase-hydrate
          "{flags}": empty
          "{package}": package-ssr-showcase
          "{target}": target-wasm
      - title: Lint `impulse-error-pages`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: Lint `impulse-server-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-server-kit
          "{target}": target-x86
      - title: Lint `impulse-server-kit-dsl`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-dsl
          "{target}": target-x86
      - title: Lint `impulse-static-server`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Lint `ssr-showcase` server
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-ssr-showcase-server
          "{flags}": empty
          "{package}": package-ssr-showcase
          "{target}": target-x86
      - title: Test docs
        used: cargo-test-doc@0.1.0
      - title: Generate docs
        used: cargo-generate-doc@0.1.0
        with:
          "{target}": target-x86
    artifacts:
      - from: target/x86_64-unknown-linux-gnu/doc
        to: docs
  - title: publish
    desc: Publish open-source libraries
    info: impulse-kit-publish@0.1.0
    tags:
      - cargo
      - publish
    default: false
    actions:
      - title: Publish `impulse-utils`
        used: cargo-publish@0.2.0
        with:
          "{features}": featureset-all
          "{package}": package-utils
      - title: Publish `impulse-server-kit`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-server-kit
      - title: Publish `impulse-static-server`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-static-server
      - title: Publish `impulse-ui-kit`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-ui-kit
  - title: build-error-pages
    desc: Got from `build`.
    info: impulse-error-pages-build@0.1.0
    default: false
    actions:
      - title: Lint
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: "Format #1"
        used: leptos-fmt@0.1.0
      - title: "Format #2"
        used: cargo-fmt@0.1.0
      - title: Build WASM
        used: trunk-build-rel@0.1.0
        with:
          "{project-folder}": folder-error-pages
      - title: Compile TailwindCSS
        used: tailwindcss-compile@0.2.0
        with:
          "{tw-input}": error-pages-tw-input
          "{tw-output}": error-pages-tw-output
      - title: Optimize WASM
        used: wasm-opt@0.1.0
        with:
          "{file}": error-pages-wasm-file
      - title: Copy favicon
        used: copy@0.1.0
        with:
          "{from}": file-error-pages-favicon
          "{to}": folder-error-pages-dist
    artifacts:
      - from: impulse-error-pages/dist
        to: error-pages
  - title: build-static-server
    info: impulse-kit-build-static-server@0.1.0
    actions:
      - title: Sync script to know Rust package version
        used: use-rust-package-version@0.1.0
      - title: Patch `Cargo.toml`
        used: impulse-kit-patch-cargo@0.1.0
      - title: Build (release mode)
        used: cargo-release@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Compress
        used: upx@0.1.0
        with:
          "%af%": binary-static-server
      - title: Auto-upload Static Server to Deployer's Storage
        used: add-static-server-to-storage@0.1.0
    artifacts:
      - from: target/x86_64-unknown-linux-gnu/release/iks
        to: static-server/iks
      - from: impulse-static-server/static-server.yaml
        to: static-server/static-server.yaml
    exclusive_exec_tag: binaries
  - title: build-showcase-no-deployer
    info: ui-kit-example-build@0.1.0
    default: false
    actions:
      - title: Lint
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-showcase
          "{target}": target-wasm
      - title: "Format #1"
        used: leptos-fmt@0.1.0
      - title: "Format #2"
        used: cargo-fmt@0.1.0
      - title: Build WASM
        used: trunk-build-rel@0.1.0
        with:
          "{project-folder}": folder-showcase
      - title: Strip WASM
        used: wasm-strip@0.1.0
        with:
