project_name: impulse-kit
version: 8
ignore_files:
  - .git
cache_files:
  - Cargo.lock
  - target
variables:
  binary-static-server:
    value:
      type: plain
      value: target/x86_64-unknown-linux-gnu/release/iks
  component-accordion:
    value:
      type: plain
      value: accordion
  component-alert:
    value:
      type: plain
      value: alert
  component-alert-dialog:
    value:
      type: plain
      value: alert-dialog
  component-aspect-ratio:
    value:
      type: plain
      value: aspect-ratio
  component-avatar:
    value:
      type: plain
      value: avatar
  component-badge:
    value:
      type: plain
      value: badge
  component-breadcrumb:
    value:
      type: plain
      value: breadcrumb
  component-button:
    value:
      type: plain
      value: button
  component-button-group:
    value:
      type: plain
      value: button-group
  component-calendar:
    value:
      type: plain
      value: calendar
  component-card:
    value:
      type: plain
      value: card
  component-carousel:
    value:
      type: plain
      value: carousel
  component-checkbox:
    value:
      type: plain
      value: checkbox
  component-collapsible:
    value:
      type: plain
      value: collapsible
  component-command:
    value:
      type: plain
      value: command
  component-context-menu:
    value:
      type: plain
      value: context-menu
  component-dropdown-menu:
    value:
      type: plain
      value: dropdown-menu
  component-icon:
    value:
      type: plain
      value: icon
  component-input:
    value:
      type: plain
      value: input
  component-input-otp:
    value:
      type: plain
      value: input-otp
  component-label:
    value:
      type: plain
      value: label
  component-popover:
    value:
      type: plain
      value: popover
  component-select:
    value:
      type: plain
      value: select
  component-separator:
    value:
      type: plain
      value: separator
  component-theme:
    value:
      type: plain
      value: theme
  empty:
    value:
      type: plain
      value: ""
  error-pages-tw-input:
    value:
      type: plain
      value: ./impulse-error-pages/input.css
  error-pages-tw-output:
    value:
      type: plain
      value: ./impulse-error-pages/dist/error_pages_tailwind.css
  error-pages-wasm-file:
    value:
      type: plain
      value: ./impulse-error-pages/dist/impulse-error-pages_bg.wasm
  featureset-all:
    value:
      type: plain
      value: " --all-features"
  featureset-utils-wasm32:
    value:
      type: plain
      value: " --no-default-features --features=reqwest"
  file-alert-dialog:
    value:
      type: plain
      value: alert_dialog
  file-aspect-ratio:
    value:
      type: plain
      value: aspect_ratio
  file-button-group:
    value:
      type: plain
      value: button_group
  file-context-menu:
    value:
      type: plain
      value: context_menu
  file-dropdown-menu:
    value:
      type: plain
      value: dropdown_menu
  file-error-pages-favicon:
    value:
      type: plain
      value: impulse-error-pages/public/favicon.ico
  file-input-otp:
    value:
      type: plain
      value: input_otp
  folder-error-pages-dist:
    value:
      type: plain
      value: impulse-error-pages/dist/
  kit-version:
    value:
      type: from_cmd
      cmd: python .depl/rust-crate-ver.py
  package-dsl:
    value:
      type: plain
      value: impulse-skdsl
  package-error-pages:
    value:
      type: plain
      value: impulse-error-pages
  package-server-kit:
    value:
      type: plain
      value: impulse-server-kit
  package-static-server:
    value:
      type: plain
      value: impulse-static-server
  package-ui-kit:
    value:
      type: plain
      value: impulse-ui-kit
  package-ui-kit-components:
    value:
      type: plain
      value: impulse-ui-kit-components
  package-utils:
    value:
      type: plain
      value: impulse-utils
  reqwest-unstable-flag:
    value:
      type: plain
      value: 'RUSTFLAGS=''--cfg reqwest_unstable'' '
  target-wasm:
    value:
      type: plain
      value: wasm32-unknown-unknown
  target-x86:
    value:
      type: plain
      value: x86_64-unknown-linux-gnu
actions:
  - info: add-static-server-to-storage@0.1.0
    action:
      type: add_to_storage
      short_name: static-server
      auto_version_rule:
        type: cmd_stdout
        cmd:
          cmd: python .depl/rust-crate-ver.py
          ignore_fails: true
          show_success_output: true
          show_cmd: false
          only_when_fresh: false
      content:
        type: fixed_files
        placements:
          - from: target/x86_64-unknown-linux-gnu/release/iks
            to: iks
          - from: impulse-static-server/static-server.yaml
            to: static-server.yaml
  - info: cargo-fmt@0.1.0
    exec_in_project_dir: true
    action:
      type: staged
      stage: build
      cmd: cargo fmt -- --config tab_spaces=2,max_width=120 */**/*.rs
  - info: cargo-generate-doc@0.1.0
    action:
      type: staged
      stage: build
      cmd: cargo doc --target {target} --workspace --no-deps
      placeholders:
        - "{target}"
  - info: cargo-lint@0.2.0
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo clippy --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
      show_success_output: true
  - info: cargo-lint-with-target@0.1.0
    requirements:
      - type: in_path
        executable: cargo
    action:
      type: staged
      stage: build
      cmd: cargo clippy --target {target}
      placeholders:
        - "{target}"
      show_success_output: true
  - info: cargo-publish@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: deploy
      cmd: cargo publish --package {package}{features}
      placeholders:
        - "{package}"
        - "{features}"
  - info: cargo-release@0.2.0
    tags:
      - rust
      - cargo
    requirements:
      - type: in_path
        executable: cargo
        desc: "Install `cargo` via your package manager or with this command: `curl https://sh.rustup.rs -sSf | sh`."
    action:
      type: staged
      stage: build
      cmd: "{flags}cargo build --release --package {package} --target {target}{features}"
      placeholders:
        - "{flags}"
        - "{package}"
        - "{target}"
        - "{features}"
  - info: cargo-test-doc@0.1.0
    requirements:
      - type: in_path
        executable: cargo
    action:
      type: staged
      stage: build
      cmd: cargo test --doc
  - info: copy@0.1.0
    action:
      type: staged
      stage: build
      cmd: cp {from} {to}
      placeholders:
        - "{from}"
        - "{to}"
  - info: depl-add-component-to-storage@0.1.0
    tags:
      - deployer
    requirements:
      - type: in_path
        executable: depl
    action:
      type: staged
      stage: build
      cmd: depl add content -o -c impulse-ui-kit/components/src/{component-file}.rs -p ui-kit-{component-name}@{kit-version}
      placeholders:
        - "{component-name}"
        - "{component-file}"
        - "{kit-version}"
  - info: leptos-fmt@0.1.0
    tags:
      - leptos
      - fmt
    requirements:
      - type: in_path
        executable: leptosfmt
        desc: "Check this: https://github.com/bram209/leptosfmt"
    exec_in_project_dir: true
    action:
      type: staged
      stage: build
      cmd: leptosfmt -t 2 ./**/*.rs
  - info: tailwindcss-compile@0.2.0
    tags:
      - tailwind
      - css
    requirements:
      - type: in_path
        executable: tailwindcss
        desc: "Install TailwindCSS standalone client: https://github.com/tailwindlabs/tailwindcss/releases"
      - type: exists
        path: ./impulse-error-pages/tw-animate.css
        desc: "Download `tw-animate` manually from: https://raw.githubusercontent.com/Wombosvideo/tw-animate-css/refs/heads/main/src/tw-animate.css"
    action:
      type: staged
      stage: build
      cmd: tailwindcss -i {tw-input} -o {tw-output} --minify
      placeholders:
        - "{tw-input}"
        - "{tw-output}"
  - info: trunk-build-rel@0.1.0
    tags:
      - trunk
      - build
      - wasm
    requirements:
      - type: in_path
        executable: trunk
        desc: "Check the website: https://trunkrs.dev/"
    action:
      type: staged
      stage: build
      cmd: cd impulse-error-pages && RUSTFLAGS="-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort" CARGO_UNSTABLE_BUILD_STD="std,panic_abort" CARGO_UNSTABLE_BUILD_STD_FEATURES="optimize_for_size" trunk build --release
  - info: upx@0.1.0
    requirements:
      - type: in_path
        executable: upx
    action:
      type: staged
      stage: build
      cmd: upx %af%
      placeholders:
        - "%af%"
  - info: use-rust-package-version@0.1.0
    action:
      type: use_from_storage
      content_info: get-know-rust-package-version@latest
  - info: wasm-opt@0.1.0
    tags:
      - wasm
      - wasm-opt
    requirements:
      - type: in_path
        executable: wasm-opt
        desc: "Install `binaryen` package or download it from this: https://github.com/WebAssembly/binaryen/releases"
    action:
      type: staged
      stage: build
      cmd: wasm-opt -Oz --all-features --strip-debug -o {file} {file}
      placeholders:
        - "{file}"
pipelines:
  - title: common-ops
    desc: Common monorepo operations
    info: impulse-kit-common-ops@0.1.0
    tags:
      - cargo
      - clippy
      - lint
      - docs
      - fmt
    default: true
    actions:
      - title: Lint `impulse-utils` on x86-64
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-x86
      - title: Lint `impulse-utils` on wasm32
        used: cargo-lint@0.2.0
        with:
          "{features}": featureset-utils-wasm32
          "{flags}": reqwest-unstable-flag
          "{package}": package-utils
          "{target}": target-wasm
      - title: Lint `impulse-ui-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit
          "{target}": target-wasm
      - title: Lint `impulse-error-pages`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: Lint `impulse-server-kit`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": reqwest-unstable-flag
          "{package}": package-server-kit
          "{target}": target-x86
      - title: Lint `impulse-server-kit-dsl`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-dsl
          "{target}": target-x86
      - title: Lint `impulse-static-server`
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Format
        used: cargo-fmt@0.1.0
      - title: Test docs
        used: cargo-test-doc@0.1.0
      - title: Generate docs
        used: cargo-generate-doc@0.1.0
        with:
          "{target}": target-x86
    artifacts:
      - from: target/x86_64-unknown-linux-gnu/doc
        to: docs
  - title: publish
    desc: Publish open-source libraries
    info: impulse-kit-publish@0.1.0
    tags:
      - cargo
      - publish
    default: false
    actions:
      - title: Publish `impulse-utils`
        used: cargo-publish@0.2.0
        with:
          "{features}": featureset-all
          "{package}": package-utils
      - title: Publish `impulse-ui-kit`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-ui-kit
      - title: Publish `impulse-server-kit`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-server-kit
      - title: Publish `impulse-static-server`
        used: cargo-publish@0.2.0
        with:
          "{features}": empty
          "{package}": package-static-server
  - title: export-ui-components
    desc: Export Impulse UI Kit components to Deployer's storage.
    info: impulse-kit-export-ui-kit-components@0.1.0
    tags:
      - deployer
      - components
      - ui-kit
    actions:
      - title: Add script to know Impulse Kit version
        used: use-rust-package-version@0.1.0
      - title: Lint components
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-ui-kit-components
          "{target}": target-wasm
      - title: Format `leptos::view!` macro content
        used: leptos-fmt@0.1.0
      - title: Format components before exporting
        used: cargo-fmt@0.1.0
      - title: Add `accordion` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-accordion
          "{component-name}": component-accordion
          "{kit-version}": kit-version
      - title: Add `alert-dialog` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-alert-dialog
          "{component-name}": component-alert-dialog
          "{kit-version}": kit-version
      - title: Add `alert` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-alert
          "{component-name}": component-alert
          "{kit-version}": kit-version
      - title: Add `aspect-ratio` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-aspect-ratio
          "{component-name}": component-aspect-ratio
          "{kit-version}": kit-version
      - title: Add `avatar` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-avatar
          "{component-name}": component-avatar
          "{kit-version}": kit-version
      - title: Add `badge` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-badge
          "{component-name}": component-badge
          "{kit-version}": kit-version
      - title: Add `breadcrumb` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-breadcrumb
          "{component-name}": component-breadcrumb
          "{kit-version}": kit-version
      - title: Add `button` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-button
          "{component-name}": component-button
          "{kit-version}": kit-version
      - title: Add `button-group` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-button-group
          "{component-name}": component-button-group
          "{kit-version}": kit-version
      - title: Add `calendar` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-calendar
          "{component-name}": component-calendar
          "{kit-version}": kit-version
      - title: Add `card` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-card
          "{component-name}": component-card
          "{kit-version}": kit-version
      - title: Add `carousel` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-carousel
          "{component-name}": component-carousel
          "{kit-version}": kit-version
      - title: Add `checkbox` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-checkbox
          "{component-name}": component-checkbox
          "{kit-version}": kit-version
      - title: Add `collapsible` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-collapsible
          "{component-name}": component-collapsible
          "{kit-version}": kit-version
      - title: Add `command` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-command
          "{component-name}": component-command
          "{kit-version}": kit-version
      - title: Add `context-menu` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-context-menu
          "{component-name}": component-context-menu
          "{kit-version}": kit-version
      - title: Add `dropdown-menu` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-dropdown-menu
          "{component-name}": component-dropdown-menu
          "{kit-version}": kit-version
      - title: Add `icon` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-icon
          "{component-name}": component-icon
          "{kit-version}": kit-version
      - title: Add `input` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-input
          "{component-name}": component-input
          "{kit-version}": kit-version
      - title: Add `input-otp` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": file-input-otp
          "{component-name}": component-input-otp
          "{kit-version}": kit-version
      - title: Add `label` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-label
          "{component-name}": component-label
          "{kit-version}": kit-version
      - title: Add `popover` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-popover
          "{component-name}": component-popover
          "{kit-version}": kit-version
      - title: Add `select` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-select
          "{component-name}": component-select
          "{kit-version}": kit-version
      - title: Add `separator` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-separator
          "{component-name}": component-separator
          "{kit-version}": kit-version
      - title: Add `theme` component
        used: depl-add-component-to-storage@0.1.0
        with:
          "{component-file}": component-theme
          "{component-name}": component-theme
          "{kit-version}": kit-version
    exclusive_exec_tag: components
  - title: build-error-pages
    desc: Got from `build`.
    info: impulse-error-pages-build@0.1.0
    default: false
    actions:
      - title: Lint
        used: cargo-lint@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-error-pages
          "{target}": target-wasm
      - title: "Format #1"
        used: leptos-fmt@0.1.0
      - title: "Format #2"
        used: cargo-fmt@0.1.0
      - title: Build WASM
        used: trunk-build-rel@0.1.0
      - title: Compile TailwindCSS
        used: tailwindcss-compile@0.2.0
        with:
          "{tw-input}": error-pages-tw-input
          "{tw-output}": error-pages-tw-output
      - title: Optimize WASM
        used: wasm-opt@0.1.0
        with:
          "{file}": error-pages-wasm-file
      - title: Copy favicon
        used: copy@0.1.0
        with:
          "{from}": file-error-pages-favicon
          "{to}": folder-error-pages-dist
    artifacts:
      - from: impulse-error-pages/dist
        to: error-pages
  - title: build-static-server
    info: impulse-kit-build-static-server@0.1.0
    actions:
      - title: Sync script to know Rust package version
        used: use-rust-package-version@0.1.0
      - title: Build (release mode)
        used: cargo-release@0.2.0
        with:
          "{features}": empty
          "{flags}": empty
          "{package}": package-static-server
          "{target}": target-x86
      - title: Compress
        used: upx@0.1.0
        with:
          "%af%": binary-static-server
      - title: Auto-upload Static Server to Deployer's Storage
        used: add-static-server-to-storage@0.1.0
    artifacts:
      - from: target/x86_64-unknown-linux-gnu/release/iks
        to: static-server/iks
      - from: impulse-static-server/static-server.yaml
        to: static-server/static-server.yaml
