# Generated by Deployer 4.X
name: lints

on:
  push:
    branches:
      - stable
      - unstable
  pull_request:
    branches:
      - unstable

env:
  TERM: xterm

jobs:
  deployer:
    name: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Preflight
      - name: Install Rust Toolchain for x86_64
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          toolchain: nightly
          components: clippy
      - name: Install Rust Toolchain for WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          toolchain: nightly
          components: clippy

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            target
          key: ${{ steps.extract_branch.outputs.branch }}-${{ runner.os }}-lints

      - name: Run pipeline
        run: |
          chmod +x .github/workflows/.pipe.lints.sh
          ./.github/workflows/.pipe.lints.sh

      - name: Save cache
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: |
            target
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

