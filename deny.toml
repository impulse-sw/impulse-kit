# cargo-deny configuration — dependency advisory / license / source gate.
# Run: `cargo deny check advisories bans licenses sources`
# Wired into the `quality` Deployer pipeline (see `.depl/config.yaml`).

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
# impulse-ring is pulled over github; allow git sources.
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
